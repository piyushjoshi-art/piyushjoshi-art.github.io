<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reserve a Table | Royal Bites</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,sans-serif;
}

a{
  text-decoration:none;
  color:inherit;
}

/* NAVBAR */

nav{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 7%;
  background:rgba(0,0,0,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #292929;
}

.logo{
  font-family:Georgia,"Times New Roman",serif;
  color:#d8a84e;
  font-size:25px;
  font-weight:bold;
}

.logo span{
  display:block;
  color:#fff;
  font-family:Arial,sans-serif;
  font-size:9px;
  letter-spacing:3px;
}

.back{
  border:1px solid #555;
  padding:10px 18px;
  border-radius:25px;
}

.back:hover{
  color:#d8a84e;
  border-color:#d8a84e;
}

/* HERO */

.hero{
  min-height:45vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:80px 7%;

  background:
  linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.82)),
  url("https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=1800&q=85")
  center/cover;
}

.hero small{
  color:#d8a84e;
  letter-spacing:4px;
}

.hero h1{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(50px,7vw,80px);
  margin:15px 0;
}

.hero p{
  color:#ccc;
}

/* RESERVATION */

.reservation{
  background:#f5f1e8;
  color:#111;
  padding:90px 7%;
}

.reservation-grid{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:60px;
  align-items:start;
}

/* INFO */

.info small{
  color:#9b7124;
  letter-spacing:3px;
}

.info h2{
  font-family:Georgia,"Times New Roman",serif;
  font-size:50px;
  line-height:1.05;
  margin:15px 0 25px;
}

.info p{
  color:#666;
  line-height:1.7;
  margin-bottom:25px;
}

.info-box{
  border-top:1px solid #ccc;
  padding:18px 0;
}

.info-box strong{
  display:block;
  margin-bottom:7px;
}

.info-box span{
  color:#666;
}

/* FORM */

.form-box{
  background:#fff;
  padding:35px;
  border-radius:20px;
  box-shadow:0 15px 45px rgba(0,0,0,.08);
}

.form-box h3{
  font-family:Georgia,"Times New Roman",serif;
  font-size:30px;
  margin-bottom:25px;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.field{
  margin-bottom:18px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:8px;
  outline:none;
  font-family:Arial,sans-serif;
  background:#fff;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#d8a84e;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.submit{
  width:100%;
  border:none;
  padding:16px;
  border-radius:30px;
  background:#111;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

.submit:hover{
  background:#d8a84e;
  color:#111;
  transform:translateY(-2px);
}

/* WHATSAPP */

.whatsapp{
  display:block;
  text-align:center;
  margin-top:15px;
  padding:14px;
  border:1px solid #ccc;
  border-radius:30px;
  color:#333;
}

.whatsapp:hover{
  border-color:#d8a84e;
  color:#9b7124;
}

/* NOTE */

.note{
  max-width:1100px;
  margin:30px auto 0;
  padding:18px;
  background:#eee9dc;
  border-radius:10px;
  color:#666;
  font-size:13px;
}

/* FOOTER */

footer{
  text-align:center;
  padding:45px 7%;
  background:#050505;
}

footer p{
  color:#777;
  margin-top:10px;
  font-size:13px;
}

/* MOBILE */

  .reservation-grid{
    grid-template-columns:1fr;
  }

  .form-row{
    grid-template-columns:1fr
